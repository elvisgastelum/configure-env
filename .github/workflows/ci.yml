# Format, lint (`vp check`), typecheck, JSON Schema and API client drift,
# and tests on every pull request and on every push to main. Every step runs
# across the whole pnpm workspace through Vite+ (https://viteplus.dev):
# setup-vp installs Vite+, Node.js, pnpm and the dependencies, and `vp run`
# replays tasks whose inputs did not change from the Vite Task cache. Each
# action is pinned to a full commit SHA (the tag in the comment) so a moved
# tag cannot change what runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks the code.
permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main
# always finish, one per commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      # Vite Task's results (node_modules/.vite/task-cache), restored after
      # the install so `vp run` replays unchanged tasks. Vite Task fingerprints
      # the inputs; the key only rolls per run.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-check-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-check-${{ runner.os }}-${{ runner.arch }}-

      # Format and lint. tsgolint's type check reports errors `tsc` does not,
      # so `vp check` leaves types to `typecheck`.
      - run: vp check
      - run: vp run typecheck
      - run: vp run schema:check
      # The committed OpenAPI document and generated client match the API.
      - run: vp run gen:api:check
      - run: vp run test

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  # Packs the package as npm would publish it, installs the tarball into a
  # throwaway project and runs the CLI through npx
  # (packages/cli/scripts/pack-smoke.sh), on every OS and supported Node
  # major: better-sqlite3 (the state database) is a native module, and the
  # install must load its prebuilt binary everywhere, never compile it.
  package:
    needs: check
    name: package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        # Git Bash on Windows: the smoke test is a bash script.
        shell: bash
    steps:
      # Keep LF endings on Windows, so bash can run the checked-out scripts.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - run: vp run build
      - run: vp run smoke
      # The manifest does not depend on the OS or Node version: checked once.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm publish --dry-run
        working-directory: packages/cli

  # Builds the design system's Storybook and runs every story in headless
  # Chromium, once in the light theme and once in the dark one; any axe
  # violation fails the job (packages/design-system/vite.config.ts). Then
  # builds the portal's Storybook.
  storybook:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: pnpm --filter @configure-env/design-system exec playwright install --with-deps chromium
      - run: vp run build-storybook
      - run: vp run test:storybook
      # The portal's stories (apps/web) must keep building.
      - run: vp run build-storybook:web

  # Proves the portal end to end (apps/e2e): Playwright drives a real
  # `configure-env serve` on fixture projects through every journey, and axe
  # fails the job on any violation, in the light and dark themes. `vp run e2e`
  # builds the portal first; CI=true gives each test one retry.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: pnpm --filter @configure-env/e2e exec playwright install --with-deps chromium
      - run: vp run e2e
      # On a failure, keep the HTML report and the traces of retried tests
      # (apps/e2e/playwright-report, apps/e2e/test-results) for a week.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
