# Lint, format check, typecheck, JSON Schema drift and tests on every pull
# request and on every push to main. Each action is pinned to a full commit
# SHA (the tag in the comment) so a moved tag cannot change what runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks the code.
permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main
# always finish, one per commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: the action reads it from `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm schema:check
      - run: pnpm test
