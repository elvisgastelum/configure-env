# Lint, format check, typecheck, JSON Schema and API client drift, and
# tests on every pull request and on every push to main. Every step runs a
# root script, which covers the whole pnpm workspace. Each action is pinned
# to a full commit SHA (the tag in the comment) so a moved tag cannot change
# what runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only checks the code.
permissions:
  contents: read

# A new push to a pull request supersedes its running checks; runs on main
# always finish, one per commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version` input: the action reads it from `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm schema:check
      # The committed OpenAPI document and generated client match the API.
      - run: pnpm gen:api:check
      - run: pnpm test

  # Packs the package as npm would publish it, installs the tarball into a
  # throwaway project and runs the CLI through npx
  # (packages/cli/scripts/pack-smoke.sh), on every OS and supported Node
  # major: better-sqlite3 (the state database) is a native module, and the
  # install must load its prebuilt binary everywhere, never compile it.
  package:
    needs: check
    name: package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        # Git Bash on Windows: the smoke test is a bash script.
        shell: bash
    steps:
      # Keep LF endings on Windows, so bash can run the checked-out scripts.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
      # The manifest does not depend on the OS or Node version: checked once.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm publish --dry-run
        working-directory: packages/cli

  # Builds the design system's Storybook and runs every story in headless
  # Chromium, once in the light theme and once in the dark one; any axe
  # violation fails the job (packages/design-system/vitest.config.ts). Then
  # builds the portal's Storybook.
  storybook:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @configure-env/design-system exec playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm test:storybook
      # The portal's stories (apps/web) must keep building.
      - run: pnpm build-storybook:web

  # Proves the portal end to end (apps/e2e): Playwright drives a real
  # `configure-env serve` on fixture projects through every journey, and axe
  # fails the job on any violation, in the light and dark themes. `pnpm e2e`
  # builds the portal first; CI=true gives each test one retry.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @configure-env/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
