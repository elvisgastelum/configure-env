# Libraries and the published CLI live in packages/; runnable apps (the
# `configure-env serve` API and web portal) go in apps/, which starts empty.
packages:
  - apps/*
  - packages/*

# tsx works with the prebuilt platform binary; the esbuild postinstall only
# re-checks it, and pnpm 12 refuses unapproved build scripts.
allowBuilds:
  esbuild: false
