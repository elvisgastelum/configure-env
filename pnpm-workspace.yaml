# Libraries and the published CLI live in packages/. apps/ is empty for now:
# the planned `configure-env serve` API and web portal will live there.
packages:
  - apps/*
  - packages/*

# tsx works with the prebuilt platform binary; the esbuild postinstall only
# re-checks it, and pnpm 12 refuses unapproved build scripts.
allowBuilds:
  esbuild: false
